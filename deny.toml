# cargo-deny configuration. Run locally with: cargo deny check
# Guards the supply chain: known-vulnerable dependencies, disallowed licenses,
# and yanked crates. Part of the secure SDLC (DESIGN.md §11).

[advisories]
# Fail on any crate with a known security advisory.
yanked = "deny"
# Accepted advisories, with rationale. Review periodically.
ignore = [
    # rsa 0.9 "Marvin attack" timing side-channel in RSA *decryption* (private-key
    # operations). No upstream fix exists. Two users here, neither reachable:
    #  - sqlx-macros → sqlx-mysql (compile-time macro infrastructure); we use the
    #    Postgres driver exclusively with SCRAM-SHA-256, so the MySQL RSA auth
    #    path is never instantiated at runtime;
    #  - crates/crypto (RFC 3161 anchor tokens) uses rsa ONLY to verify TSA
    #    signatures with public keys — no private-key operation ever runs.
    "RUSTSEC-2023-0071",
]

[bans]
# Multiple versions of the same crate are a warning, not a hard failure (common
# and usually benign in a large dependency tree).
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by workspace path (no version), which
# cargo-deny would otherwise count as a wildcard requirement.
allow-wildcard-paths = true

[licenses]
# Permissive licenses we accept for dependencies. Our own crates are proprietary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots: the Mozilla root-certificate bundle (data, not code) that
    # rustls-based TLS in sqlx carries. Permissive data licence.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Our workspace crates are marked `license = "proprietary"`, which is not an SPDX
# id; skip license-checking our own code (we only vet third-party licenses).
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
