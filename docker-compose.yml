# Local development environment (§12.10 "Dev").
#
# This is the ONE-MACHINE dev stack — deliberately minimal. The production HA
# datacenter topology (§12.4) is a separate, later concern and lives nowhere
# near this file. Bring it up with:  docker compose up -d
#
# Postgres (the ledger), NATS with JetStream (the outbox relay's transport) and
# Redis (shared rate-limit counters) — the same three dependencies as production.
services:
  postgres:
    # Same Postgres release as production (alpine kept: switching libc under an
    # existing data volume would change text collations).
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: payment_pg_dev
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment_dev_pw
      POSTGRES_DB: payment
    # A lighter cut of the production tuning (deploy/docker-compose.prod.yml),
    # so local benchmarks and slow-query logs behave like the real thing.
    # synchronous_commit stays on: it is a ledger.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=250ms
      - -c
      - log_lock_waits=on
      - -c
      - shared_preload_libraries=pg_stat_statements
    shm_size: 256m
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Event bus for the outbox relay (transaction.posted events).
  nats:
    image: nats:2.11.17-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    container_name: payment_nats_dev
    command: ["-js", "-sd", "/data"] # JetStream with a durable store dir
    volumes:
      - nats_data:/data
    ports:
      - "4222:4222"

  # Shared store for multi-instance rate limiting (and later: sessions, hot reads).
  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: payment_redis_dev
    ports:
      - "6379:6379"

volumes:
  pg_data:
  nats_data:
