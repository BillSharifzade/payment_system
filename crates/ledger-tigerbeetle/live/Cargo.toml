[package]
name = "ledger-tigerbeetle-live"
version = "0.1.0"
edition = "2021"
license = "proprietary"
rust-version = "1.98"
publish = false
description = "TigerBeetle's native client behind ledger-tigerbeetle's TbClient, the integration suites against a live cluster, and the posting benchmark. Outside the workspace because building the client needs Zig (ZIG_PATH, else it is downloaded) and libclang."

# Its own workspace: the root one cannot build the native client without Zig.
[workspace]

[dependencies]
ledger-tigerbeetle = { path = "..", features = ["testkit"] }
ledger = { path = "../../ledger" }
money = { path = "../../money" }
storage = { path = "../../storage" }
# The official Rust client is not published (crates.io `tigerbeetle` is a 0.0.1 placeholder);
# 0.14.28 is "0.14.28+0.16.78": it embeds the TigerBeetle 0.16.78 client, which 0.16.4+ and
# 0.17.x servers accept (release_client_min).
tigerbeetle-unofficial = { version = "=0.14.28", features = ["tokio-rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v7"] }

[profile.release]
# TigerBeetle's advice for applications using its client: overflow is catastrophic in accounting.
overflow-checks = true
