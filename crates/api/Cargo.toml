[package]
name = "api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "HTTP API for the payment system (axum). Exposes accounts, deposits, transfers and balances over a versioned REST interface."

[lib]
path = "src/lib.rs"

[[bin]]
name = "payment-server"
path = "src/main.rs"

[features]
# LEDGER_BACKEND=tigerbeetle: TigerBeetle's native client. Off by default, because building
# it needs Zig and libclang; without it the server refuses LEDGER_BACKEND=tigerbeetle. The
# hybrid protocol itself is always compiled (and tested against the in-process cluster model).
tigerbeetle = ["ledger-tigerbeetle/native-client"]

[dependencies]
money = { workspace = true }
ledger = { workspace = true }
storage = { workspace = true }
ledger-tigerbeetle = { path = "../ledger-tigerbeetle" }
auth = { workspace = true }
biometric = { workspace = true }
base64 = { workspace = true }
p256 = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json.workspace = true
sqlx = { workspace = true }
uuid = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http = { workspace = true, features = ["timeout", "request-id", "set-header", "util"] }
deadpool-redis.workspace = true
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

[dev-dependencies]
ledger-tigerbeetle = { path = "../ledger-tigerbeetle", features = ["testkit"] }
rand_core = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
