[package]
name = "biometric"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Biometric primitives for fingerprint payments: template validation, at-rest template encryption, the identification decision policy, terminal API keys and the HTTP adapter to an external matching engine. No database."

[dependencies]
aes-gcm = { workspace = true }
base64 = { workspace = true }
rand_core = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
sha2 = { workspace = true }
hex = { workspace = true }
thiserror.workspace = true
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
