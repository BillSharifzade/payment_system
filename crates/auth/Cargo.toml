[package]
name = "auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Authentication primitives: Argon2id password hashing, JWT access tokens, opaque refresh tokens. Pure — no database."

[dependencies]
argon2 = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
thiserror.workspace = true
uuid = { workspace = true }
