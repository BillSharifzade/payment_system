[package]
name = "workers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Background workers: the checkpoint sealer (tamper-evidence) with external anchoring and signers, and the continuous reconciliation job."

[lib]
path = "src/lib.rs"

[[bin]]
name = "payment-workers"
path = "src/main.rs"

[dependencies]
crypto = { workspace = true }
hex = { workspace = true }
sqlx = { workspace = true }
serde_json.workspace = true
async-nats = "0.49"
futures = "0.3"
bytes = "1"
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
reqwest = { workspace = true }
base64 = { workspace = true }
rand_core = { workspace = true }
# PKCS#11 HSM signer: the module (.so) is loaded at runtime, nothing links here.
cryptoki = "0.12"

[dev-dependencies]
crypto = { workspace = true, features = ["test-tsa"] }
axum = { workspace = true }
storage = { workspace = true }
ledger = { workspace = true }
money = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
