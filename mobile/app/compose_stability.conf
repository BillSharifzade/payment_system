// Compose compiler stability configuration (wired in app/build.gradle.kts).
//
// :core is a pure-Kotlin module with no Compose dependency, so it cannot carry
// @Immutable/@Stable annotations. Everything in it that reaches a composable is
// an immutable data class, enum or sealed type (Money, WalletDto,
// StatementEntryDto, FxRateDto, PendingPayment, ErrorCode, ...). Declaring the
// package stable here lets the compiler skip recomposition of rows/cards whose
// :core inputs are unchanged instead of treating every cross-module class as
// unstable.
tj.payment.core.**
