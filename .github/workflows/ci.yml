name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payment
          POSTGRES_PASSWORD: payment_dev_pw
          POSTGRES_DB: payment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment -d payment"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Dependency audit (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Unit & property tests (no database)
        run: cargo test --workspace

      - name: Integration tests (against Postgres)
        env:
          DATABASE_URL: postgres://payment:payment_dev_pw@localhost:5432/payment
        run: cargo test --workspace -- --include-ignored
