# Fuzzing (cargo-fuzz / libFuzzer) and undefined-behaviour checks (Miri) for the parsers and
# invariants reachable from untrusted input. Targets, seeds and dictionaries live in fuzz/;
# fuzz/run.sh runs them the same way locally.
#
# - pull requests and pushes: build every target, run each for 75 s;
# - nightly: 10 minutes per target from the cached corpus, then minimise and re-cache it;
#   a failing run uploads its reproducers;
# - Miri on the pure crates.
#
# Third-party actions are pinned to full commit SHAs (the comment is the tag the SHA resolves
# to), and so is the nightly toolchain. Bump deliberately.
name: Fuzz

on:
  pull_request:
    paths:
      - "crates/money/**"
      - "crates/ledger/**"
      - "crates/auth/**"
      - "crates/biometric/**"
      - "crates/crypto/**"
      - "crates/api/**"
      - "crates/storage/**"
      - "fuzz/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths:
      - "crates/money/**"
      - "crates/ledger/**"
      - "crates/auth/**"
      - "crates/biometric/**"
      - "crates/crypto/**"
      - "crates/api/**"
      - "crates/storage/**"
      - "fuzz/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz target
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FUZZ_TOOLCHAIN: nightly-2026-10-08
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    name: cargo-fuzz — every target
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SECONDS_PER_TARGET: ${{ inputs.seconds || (github.event_name == 'schedule' && '600') || '75' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust ${{ env.FUZZ_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
          key: ${{ env.FUZZ_TOOLCHAIN }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"

      # The root workspace's fmt/clippy (ci.yml) do not see this excluded crate.
      - name: Format and clippy (fuzz crate)
        working-directory: fuzz
        run: |
          cargo +"$FUZZ_TOOLCHAIN" fmt -- --check
          cargo +"$FUZZ_TOOLCHAIN" clippy --all-targets -- -D warnings

      # -a: debug assertions and overflow checks, so a wrapping add is a finding.
      - name: Build every target
        working-directory: fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz build -a

      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz (${{ env.SECONDS_PER_TARGET }} s per target)
        run: fuzz/run.sh "$SECONDS_PER_TARGET"

      - name: Minimise the corpus
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        working-directory: fuzz
        run: |
          set -euo pipefail
          for t in $(cargo +"$FUZZ_TOOLCHAIN" fuzz list); do
            cargo +"$FUZZ_TOOLCHAIN" fuzz cmin -a "$t" "corpus/$t" >/dev/null 2>&1
            echo "$t: $(find "corpus/$t" -type f | wc -l) inputs"
          done

      - name: Save the corpus
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload reproducers and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ github.run_id }}
          path: |
            fuzz/artifacts/
            fuzz/logs/
          if-no-files-found: ignore
          retention-days: 30

  miri:
    name: Miri — money, ledger, crypto, biometric
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust ${{ env.FUZZ_TOOLCHAIN }} with Miri
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
          components: miri, rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: miri-${{ env.FUZZ_TOOLCHAIN }}

      # Not auth: its JWT path is ring's C/assembly and Argon2 at production cost, neither
      # of which Miri can execute in useful time. Isolation is off for the clock (UUIDv7),
      # OS randomness and proptest's failure files; proptest cases are cut to stay in budget.
      - name: Miri (unit and property tests)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: "4"
        run: cargo +"$FUZZ_TOOLCHAIN" miri test -p money -p ledger -p crypto -p biometric --lib
