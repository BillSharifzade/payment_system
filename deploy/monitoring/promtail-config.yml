server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Tail every container's JSON log file (Docker's default json-file driver).
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      # 1. Unwrap the Docker envelope to get the raw app log line.
      - json:
          expressions:
            log: log
            stream: stream
      # 2. Parse our app's JSON logs to promote level/message/target to labels.
      - json:
          source: log
          expressions:
            level: level
            target: target
            message: fields.message
      - labels:
          stream:
          level:
      - output:
          source: log
