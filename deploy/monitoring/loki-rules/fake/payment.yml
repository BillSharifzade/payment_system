# Loki ruler: log-based alerts, evaluated by Loki and sent to Alertmanager.
# Labels come from promtail (deploy/monitoring/promtail-config.yml):
#   project = compose project ("payment"), service = compose service name.
# The two integrity lines are the money-integrity tripwires from deploy/README.md.
groups:
  - name: payment-ledger-integrity
    interval: 1m
    rules:
      - alert: ReconciliationFailed
        expr: |
          sum(count_over_time({project="payment", service="payment-workers"} |= "RECONCILIATION FAILED" [5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Ledger reconciliation FAILED"
          description: >-
            payment-workers logged RECONCILIATION FAILED in the last 5 minutes:
            balances no longer sum to zero per currency or do not match their
            entries. Page a human. Do not restart anything before the ledger has
            been inspected (deploy/restore-drill.sh runs the same checks against
            the last backup).

      - alert: ChainVerificationFailed
        expr: |
          sum(count_over_time({project="payment", service="payment-workers"} |= "CHAIN VERIFICATION FAILED" [5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Checkpoint chain verification FAILED (possible tampering)"
          description: >-
            A signed checkpoint failed the independent re-verification. Treat as a
            security incident: preserve the database and logs before acting.

      # (NoCheckpointsSealed was removed: absence of a "sealed new checkpoints"
      # line also fired on every idle ledger. The precise signal is the age of
      # the oldest UNSEALED transaction — Prometheus alerts UnsealedBacklogAging
      # and LedgerSealingLagging in prometheus-rules.yml.)

  - name: payment-backups
    interval: 1m
    rules:
      - alert: BackupErrorLogged
        # The sidecars log "ERROR:" on every failed stage (dump, archive,
        # encryption, off-box copy). Prometheus' BackupStale/BackupFailed are
        # the authoritative alerts; this one carries the error text sooner.
        expr: |
          sum by (service) (count_over_time({project="payment", service=~"postgres-backup|kyc-backup"} |= "ERROR:" [10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} logged a backup ERROR"
          description: >-
            docker compose logs --tail=100 {{ $labels.service }} — a backup that
            fails keeps failing until fixed; the sidecar retries hourly.

  - name: payment-containers
    interval: 1m
    rules:
      - alert: ContainerRestarted
        # Every service prints exactly one "ready" banner per start; seeing it
        # more than once in 15 minutes means the container restarted (crash
        # loop, OOM kill, ...). Postgres prints its banner twice on the very
        # first initialisation of a fresh volume — a one-off false positive.
        expr: |
          sum by (service) (
            count_over_time({project="payment"}
              |~ "metrics exporter listening|database system is ready to accept connections|Ready to accept connections|Server is ready|serving initial configuration"
            [15m])
          ) > 1
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} restarted"
          description: >-
            {{ $labels.service }} started {{ $value }} times in the last 15 minutes.
            `docker compose ps` + `docker compose logs --tail=200 {{ $labels.service }}`.
