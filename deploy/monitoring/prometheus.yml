# Prometheus: scrapes the two app binaries' metrics listeners (METRICS_ADDR),
# the host (node-exporter, incl. the backup sidecars' textfile metrics) and
# Postgres (postgres-exporter) on the internal `monitoring` network, and
# evaluates deploy/monitoring/prometheus-rules.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # DNS discovery (type A) returns one target per replica, so API_REPLICAS=N
  # is scraped without touching this file.
  - job_name: payment-server
    dns_sd_configs:
      - names: ["payment-server"]
        type: A
        port: 9100
        refresh_interval: 30s

  - job_name: payment-workers
    dns_sd_configs:
      - names: ["payment-workers"]
        type: A
        port: 9101
        refresh_interval: 30s

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
