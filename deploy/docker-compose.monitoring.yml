# Optional monitoring overlay: ships the app's structured JSON logs to Loki and
# serves Grafana dashboards. Start alongside the core stack:
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
#
# Grafana binds to 127.0.0.1 only — reach it via SSH tunnel:
#   ssh -L 3000:localhost:3000 user@server   then open http://localhost:3000
name: payment

services:
  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - lokidata:/loki
    expose: ["3100"]

  promtail:
    image: grafana/promtail:2.9.8
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtailpos:/tmp
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki

volumes:
  lokidata:
  grafanadata:
  promtailpos:
