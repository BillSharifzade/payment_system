# Postgres hosts (the single-node box, and every Patroni member): copy to /etc/sysctl.d/ and
# run `sysctl --system`.
#
# The kernel's defaults write dirty file pages out every 5 s, once they are 30 s old. On a
# database host that means a burst of data-file writes every 5 s, and while the device
# absorbs a burst every fsync on it waits — including the WAL flush every COMMIT is waiting
# for. Measured with payment-loadtest (crates/loadtest/README.md, "Tail latency"): about 30
# commits at a time stalled ~100 ms, every few seconds, which was the whole p99.9.
#
# Writing back every second, pages older than 2 s, keeps each burst small: p99.9 fell from
# 150-166 ms to 78 ms with throughput and p99 unchanged. Durability is not involved (Postgres
# fsyncs what it needs); this only changes when the kernel starts background writeback.
# Putting pg_wal on its own device removes the interference altogether; do both if you can.
vm.dirty_writeback_centisecs = 100
vm.dirty_expire_centisecs = 200
