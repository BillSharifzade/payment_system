# HAProxy in front of the Patroni cluster: the ONLY database address clients
# know (in the compose overlay it answers as `postgres`, so every existing URL,
# the backup sidecar and postgres-exporter follow the leader unchanged).
#
#   :5432  read-write — only the member whose Patroni REST API answers
#          GET /primary 200 (running AND holding the leader key).
#   :5433  read-only  — streaming replicas less than 16 MB behind
#          (GET /replica?lag=16MB), round-robin. Nothing uses it yet.
#   :8404  /health (200 only while a primary is in rotation: the compose
#          healthcheck), /metrics (Prometheus), /stats.
#
# Plain TCP proxying keeps each client session on one server session, so
# session state — the workers' leader-election advisory lock — behaves exactly
# as on a direct connection (never put a transaction-mode pooler here).
#
# Addresses come from the environment (HAProxy expands "${VAR}"):
#   HA_PG1 HA_PG2 HA_PG3            host:port of each member's Postgres
#   HA_API1_PORT .. HA_API3_PORT    each member's REST API port (same host)
#   HA_BIND_RW HA_BIND_RO HA_BIND_ADMIN   listen addresses
global
    log stdout format raw local0 info
    maxconn 2000
    hard-stop-after 30s

# Members' names are re-resolved continuously: a container comes back from a
# restart with a new address.
resolvers sys
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 5s
    hold obsolete 5s

defaults
    mode tcp
    log global
    option dontlognull
    retries 2
    timeout connect 3s
    # Pooled database sessions idle for minutes; do not cut them.
    timeout client 30m
    timeout server 30m
    timeout check 2s

listen primary
    bind "${HA_BIND_RW}"
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    # 1 s checks, out after 2 failures, back after 2 successes.
    # on-marked-down shutdown-sessions: when a member stops being the leader
    # (crash, demotion, freeze) every session through it is cut at once —
    # otherwise a session to a frozen old leader would hang until TCP gives
    # up, and the workers' lock connection would never notice.
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions resolvers sys init-addr last,libc,none
    server pg-1 "${HA_PG1}" check port "${HA_API1_PORT}"
    server pg-2 "${HA_PG2}" check port "${HA_API2_PORT}"
    server pg-3 "${HA_PG3}" check port "${HA_API3_PORT}"

listen replicas
    bind "${HA_BIND_RO}"
    balance roundrobin
    option httpchk
    http-check send meth GET uri /replica?lag=16MB
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers sys init-addr last,libc,none
    server pg-1 "${HA_PG1}" check port "${HA_API1_PORT}"
    server pg-2 "${HA_PG2}" check port "${HA_API2_PORT}"
    server pg-3 "${HA_PG3}" check port "${HA_API3_PORT}"

frontend admin
    bind "${HA_BIND_ADMIN}"
    mode http
    timeout client 10s
    monitor-uri /health
    monitor fail if { nbsrv(primary) lt 1 }
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
