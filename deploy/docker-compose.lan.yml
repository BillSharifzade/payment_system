# LAN TEST BOX — DEV/STAGING ONLY. Never real money, never a public interface.
#
# The same hardened stack as docker-compose.prod.yml (keep the two in sync when
# you change one) with a different edge, because 80/443 on that host belong to
# another application and a bare LAN IP cannot get a public certificate:
#
#   Console  http://<LAN_BIND_ADDRESS>:8088/admin/  -> caddy:80
#   API      http://<LAN_BIND_ADDRESS>:8099/v1/...  -> caddy:8099 -> payment-server
#
# Both ports are served by Caddy — payment-server publishes nothing — so the
# admin allowlist (ADMIN_ALLOW_CIDR) and the per-replica health checks apply
# here too, and app.env keeps TRUST_PROXY=true. Plain HTTP: anyone on the LAN
# segment can read the traffic. They are bound to LAN_BIND_ADDRESS (required),
# never to 0.0.0.0. For TLS on the LAN, set SITE_ADDRESS=192.168.1.156:8443
# (internal CA, see deploy/README.md "Internal CA") and publish 8443 instead.
#
# Images are NOT built here (2 vCPU): build on the dev box, then
#   docker save payment-system:<tag> payment-console:<tag> payment-backup:<tag> | ssh box 'docker load'
#   IMAGE_TAG=<tag> ./deploy.sh --no-build
# Ship the deploy/ directory (without your dev secrets) to ~/payment-deploy/;
# .env there: COMPOSE_FILE=docker-compose.lan.yml, LAN_BIND_ADDRESS=..., ADMIN_ALLOW_CIDR=...
name: payment

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
      # Stamp each line with the compose service/project so promtail can label
      # streams without access to the Docker socket (see monitoring overlay).
      labels: "com.docker.compose.service,com.docker.compose.project"

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

# Everything the two app binaries share. IMAGE_TAG is set by deploy.sh from
# `git rev-parse --short HEAD`; `latest` is also tagged on every build.
x-app: &app
  image: payment-system:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: [app.env]
  <<: [*logging, *hardening]
  group_add: ["${SECRETS_GID:-10500}"]
  read_only: true
  tmpfs: [/tmp]
  stop_grace_period: 30s

# The two backup sidecars (same image, different job).
x-backup: &backup
  image: payment-backup:${IMAGE_TAG:-latest}
  restart: unless-stopped
  <<: [*logging, *hardening]
  group_add: ["${SECRETS_GID:-10500}"]
  read_only: true
  # The base image declares a VOLUME here; a tmpfs keeps it from becoming an
  # anonymous volume. /tmp holds file lists and gpg's throwaway home.
  tmpfs: [/tmp, "/var/lib/postgresql/data:size=1m"]
  stop_grace_period: 2m

services:
  postgres:
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    <<: [*logging, *hardening]
    # Runs as the image's postgres user (999:999) from the start — no root
    # entrypoint phase, so every capability is dropped — with the secrets group
    # for /run/secrets. The data volume is owned by 999 already.
    user: "999:999"
    group_add: ["${SECRETS_GID:-10500}"]
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: payment
      # Page checksums catch silent disk corruption. Only applied when the data
      # volume is first initialised.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # The role passwords are read by postgres/10-roles.sh (first init, and on
    # every deploy via `docker compose exec`).
    secrets: [postgres_password, pg_owner_password, pg_app_password, pg_backup_password, pg_monitor_password]
    # Server-level tuning for a ~4 GB box that also runs the app (the app sets
    # its own per-session GUCs: statement/lock/idle timeouts).
    #   synchronous_commit=on   this is a ledger: a COMMIT must be on disk before
    #                           the client hears about it. NEVER turn this off.
    #   pg_stat_statements      `CREATE EXTENSION pg_stat_statements;` once to
    #                           query it (collection is on regardless).
    #   password_encryption     SCRAM verifiers only (the PG 14+ default, pinned).
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=250ms
      - -c
      - log_lock_waits=on
      - -c
      - log_connections=off
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - synchronous_commit=on
    # Parallel query workers and shared_buffers live in shared memory; the
    # Docker default of 64 MB is too small for a 384 MB shared_buffers.
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 10-roles.sh runs on first init; roles.psql is its SQL (ignored by the
      # entrypoint, which only runs *.sh/*.sql files).
      - ./postgres:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    # SIGINT = "fast shutdown": abort open transactions, checkpoint, exit
    # cleanly. (The default SIGTERM is "smart" mode, which waits for every
    # client to disconnect and would hit the kill timeout under the app's
    # long-lived pool connections, forcing crash recovery on the next start.)
    stop_signal: SIGINT
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M
          pids: 512
    # --- WAL archiving / point-in-time recovery -----------------------------
    # Ready to enable: see docker-compose.wal-archive.yml (pgBackRest to an
    # off-box S3-compatible bucket) and deploy/README.md "WAL archiving".

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    <<: [*logging, *hardening]
    # Start directly as the image's `redis` user (uid 999, gid 1000): with every
    # capability dropped the entrypoint cannot `setpriv` from root to redis.
    user: "999:1000"
    group_add: ["${SECRETS_GID:-10500}"]
    # Rate-limit counters only: bounded memory, LRU eviction, AOF so a restart
    # does not reset every window at once. Clients must authenticate: the ACL
    # file (users `payment` — password stored as a SHA-256 hash, dangerous
    # commands removed — and a PING-only `healthcheck`; `default` disabled) is
    # generated by deploy.sh.
    command:
      - redis-server
      - --aclfile
      - /run/secrets/redis_acl
      - --appendonly
      - "yes"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    secrets: [redis_acl]
    read_only: true
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user healthcheck --pass healthcheck ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 256

  nats:
    image: nats:2.11.17-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    restart: unless-stopped
    <<: [*logging, *hardening]
    group_add: ["${SECRETS_GID:-10500}"]
    # JetStream with a durable store dir (the workers create the PAYMENTS
    # stream). Clients authenticate (user/password from the generated
    # auth.conf); the monitoring endpoint listens on loopback only, for the
    # healthcheck. See deploy/nats/nats.conf.
    command: ["-c", "/etc/nats/nats.conf"]
    configs:
      - source: nats_conf
        target: /etc/nats/nats.conf
    secrets:
      - source: nats_auth.conf
        target: /etc/nats/auth.conf
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - natsdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256

  payment-server:
    <<: *app
    # Migrations run automatically on startup AS payment_owner
    # (MIGRATION_DATABASE_URL; sqlx holds an advisory lock, so >1 replica is
    # safe); the request path uses payment_app (DATABASE_URL). Scale with
    # API_REPLICAS in .env + ./deploy.sh (Caddy health-checks each replica).
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          memory: 512M
          pids: 512
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      REDIS_URL_FILE: /run/secrets/redis_url
      BIOMETRIC_TEMPLATE_KEY_FILE: /run/secrets/biometric_template_key
      # Prometheus metrics on a second listener: reachable from the monitoring
      # overlay on its network, never published to the host.
      METRICS_ADDR: 0.0.0.0:9100
      # Uploaded KYC documents (served only via the admin endpoint).
      DOCUMENT_STORE_DIR: /data/kyc-docs
    secrets: [database_url, migration_database_url, jwt_secret, redis_url, biometric_template_key]
    volumes:
      - kycdocs:/data/kyc-docs
    networks: [edge, backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    # Distroless image: no shell, no curl. The binary probes its own /ready
    # (503 while the database ping fails).
    healthcheck:
      test: ["CMD", "/usr/local/bin/payment-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  payment-workers:
    <<: *app
    entrypoint: ["/usr/local/bin/payment-workers"]
    # One replica by default. More are safe: replicas elect a leader through a
    # Postgres advisory lock (only the leader seals, verifies, reconciles and
    # prunes; the others stand by — see the worker_leader metric), which is why
    # DATABASE_URL must be a direct or session-mode connection, never a
    # transaction-mode pooler.
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      WORKER_SIGNING_KEY_FILE: /run/secrets/worker_signing_key
      # Every public key whose checkpoints the verifier accepts (the current
      # key's is always included; keep retired keys here after a rotation).
      WORKER_TRUSTED_PUBLIC_KEYS_FILE: /run/secrets/worker_trusted_public_keys
      NATS_URL_FILE: /run/secrets/nats_url
      METRICS_ADDR: 0.0.0.0:9101
      # Retention prunes orphaned KYC documents, so it needs the same volume the
      # API writes them to.
      DOCUMENT_STORE_DIR: /data/kyc-docs
      # Touched every tick; the healthcheck fails when it is older than
      # max(30 s, 3 x WORKER_INTERVAL_SECS). Lives on the tmpfs above.
      WORKER_HEARTBEAT_FILE: /tmp/payment-workers.heartbeat
    secrets: [database_url, worker_signing_key, worker_trusted_public_keys, nats_url]
    volumes:
      - kycdocs:/data/kyc-docs
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      nats:     { condition: service_healthy }
      payment-server: { condition: service_healthy }   # the server migrates first
    healthcheck:
      test: ["CMD", "/usr/local/bin/payment-workers", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      # The full checkpoint chain is re-verified from genesis on every start.
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 512

  caddy:
    image: payment-console:${IMAGE_TAG:-latest}
    restart: unless-stopped
    <<: [*logging, *hardening]
    # Non-root (uid 10001, see Dockerfile.console) with NO capabilities: the
    # sysctl lets an unprivileged process bind :80 inside its own network
    # namespace (Docker's default since 20.10; set explicitly here).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    # TLS terminates here; Caddy sets X-Forwarded-For to the real client IP
    # (the app runs with TRUST_PROXY=true and reads the right-most hop).
    environment:
      # Console on :80 (published as 8088) and the API on :8099, plain HTTP.
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80, http://:8099}
      # Required: who may reach the admin console AND the admin API. deploy.sh
      # refuses to deploy without it; "0.0.0.0/0 ::/0" = anyone (warned).
      ADMIN_ALLOW_CIDR: ${ADMIN_ALLOW_CIDR:?set ADMIN_ALLOW_CIDR in deploy/.env (IPs/CIDRs allowed to reach /admin and the admin API)}
      # One upstream per API replica (deploy.sh derives it from API_REPLICAS).
      API_UPSTREAMS: ${API_UPSTREAMS:-payment-payment-server-1:8080}
    # Bound to the LAN address only (required), never 0.0.0.0.
    ports:
      - "${LAN_BIND_ADDRESS:?set LAN_BIND_ADDRESS in deploy/.env (the LAN IP to publish 8088/8099 on)}:8088:80"
      - "${LAN_BIND_ADDRESS:?set LAN_BIND_ADDRESS in deploy/.env}:8099:8099"
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - caddydata:/data       # certificates, internal CA, access log
      - caddyconfig:/config
    networks: [edge]
    depends_on:
      payment-server: { condition: service_healthy }
    # Liveness of the Caddy process itself via its localhost-only admin API
    # (upstream health is Caddy's own job: see health_uri in the Caddyfile).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 256

  # ---- Backups (into the `backups` volume, encrypted; copy them off-box!) -----
  # Daily dump of the ledger at BACKUP_DB_AT (UTC) as the read-only
  # payment_backup role, plus one before every deploy (deploy.sh). Retention
  # 14 daily / 8 weekly / 12 monthly. Healthy = last SUCCESS younger than 26 h.
  # Restore drill: ./restore-drill.sh
  postgres-backup:
    <<: *backup
    command: ["db"]
    environment:
      PGHOST: postgres
      PGDATABASE: payment
      PGUSER: payment_backup
      PGPASSWORD_FILE: /run/secrets/pg_backup_password
      BACKUP_AT: ${BACKUP_DB_AT:-02:00}
      BACKUP_ENCRYPTION: ${BACKUP_ENCRYPTION:-auto}
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "12"
    secrets: [pg_backup_password, backup_recipients, backup_rclone_conf]
    volumes:
      - backups:/backups
      - backupmetrics:/metrics
    networks: [backend, egress]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup-healthcheck.sh", "db"]
      interval: 60s
      timeout: 10s
      retries: 2
      # On a fresh install the first dump runs at start (catch-up).
      start_period: 15m
    deploy:
      resources:
        limits:
          memory: 192M
          pids: 128

  # Nightly encrypted tarball of the KYC documents at BACKUP_KYC_AT, 14-day
  # retention. Runs as uid 65532 (the uid the app writes them as), no network
  # beyond the optional off-box copy.
  kyc-backup:
    <<: *backup
    command: ["kyc"]
    environment:
      BACKUP_AT: ${BACKUP_KYC_AT:-02:30}
      BACKUP_ENCRYPTION: ${BACKUP_ENCRYPTION:-auto}
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      KYC_BACKUP_KEEP_DAYS: "14"
    secrets: [backup_recipients, backup_rclone_conf]
    volumes:
      - kycdocs:/src:ro
      - backups:/backups
      - backupmetrics:/metrics
    networks: [egress]
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup-healthcheck.sh", "kyc"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 15m
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 64

networks:
  edge: {}
  backend:
    internal: true
  egress: {}

configs:
  nats_conf:
    file: ./nats/nats.conf

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  pg_owner_password:
    file: ./secrets/pg_owner_password
  pg_app_password:
    file: ./secrets/pg_app_password
  pg_backup_password:
    file: ./secrets/pg_backup_password
  pg_monitor_password:
    file: ./secrets/pg_monitor_password
  database_url:
    file: ./secrets/database_url
  migration_database_url:
    file: ./secrets/migration_database_url
  jwt_secret:
    file: ./secrets/jwt_secret
  worker_signing_key:
    file: ./secrets/worker_signing_key
  worker_trusted_public_keys:
    file: ./secrets/worker_trusted_public_keys
  biometric_template_key:
    file: ./secrets/biometric_template_key
  redis_acl:
    file: ./secrets/redis_acl
  redis_url:
    file: ./secrets/redis_url
  nats_auth.conf:
    file: ./secrets/nats_auth.conf
  nats_url:
    file: ./secrets/nats_url
  backup_recipients:
    file: ./secrets/backup_recipients
  backup_rclone_conf:
    file: ./secrets/backup_rclone_conf

volumes:
  pgdata:
  redisdata:
  natsdata:
  caddydata:
  caddyconfig:
  kycdocs:
  backups:
  # node-exporter textfile collector input (backup last-success timestamps).
  backupmetrics:
