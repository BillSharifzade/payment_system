# NATS server configuration for the payment stack (mounted read-only at
# /etc/nats/nats.conf by the compose files).
#
# Clients must authenticate: the credentials live in auth.conf, a compose
# secret generated by deploy.sh (deploy/secrets/nats_auth.conf) and mounted
# next to this file; payment-workers receives the matching URL through
# NATS_URL_FILE. Nothing else connects to NATS.

port: 4222

# Monitoring endpoint, loopback only: used by the container healthcheck
# (healthz), never reachable from the network.
http: "127.0.0.1:8222"

jetstream {
  store_dir: "/data"
  # Bounded so a stuck consumer cannot fill the disk the ledger lives on.
  max_memory_store: 64MB
  max_file_store: 2GB
}

# Generated, secret: authorization { user: payment, password: "..." }
include ./auth.conf
